version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: expense-postgres
    environment:
      POSTGRES_DB: expense_manager
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
      DB_PASSWORD: expense_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U expense_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: expense-app
    ports:
      - "8080:8080"
    depends_on:
        postgres:
          condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: expense_pass
      JWT_SECRET: prod-secret-key

volumes:
  postgres_data: