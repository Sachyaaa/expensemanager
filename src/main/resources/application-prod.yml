spring:
#need to change
  datasource:
    url: jdbc:postgresql://postgres:5432/expense_manager
    username: expense_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000